</head>
<body>
  <div class="app-layout">
    <aside class="sidebar" aria-label="Sidomeny">
      <a href="#" class="brand" id="brandHome"><span class="brand-icon">▶</span><span>stream<span class="brand-highlight">hub</span></span></a>
      <span class="small-caps nav-caption">UPPTÄCK</span>
      <nav aria-label="Huvudnavigation" id="sidebarNav">
        <button class="nav-item active" data-page="home"><span class="nav-glyph">⌂</span> Hem</button>
        <button class="nav-item" data-page="movie"><span class="nav-glyph">▣</span> Filmer</button>
        <button class="nav-item" data-page="tv"><span class="nav-glyph">▤</span> Serier</button>

    </aside>

        <div class="search-wrap">
          <span class="search-ico">⌕</span><input id="searchInput" type="search" placeholder="Sök bland filmer och serier ..." aria-label="Sök filmer och serier" autocomplete="off" /><kbd class="desktop-only">Sök</kbd>
        </div>
        <button id="settingsTop" class="round-button" title="Inställningar" aria-label="Inställningar">⚙</button>
      </header>
      <main id="main" tabindex="-1" aria-live="polite"></main>
      <footer class="site-footer"><span>Data från <a href="https://www.themoviedb.org/" target="_blank" rel="noopener">TMDB</a>. Streamingtillgänglighet från <a href="https://www.justwatch.com/se" target="_blank" rel="noopener">JustWatch</a>.</span><span>This product uses the TMDB API but is not endorsed or certified by TMDB.</span></footer>

  <nav class="bottom-nav" aria-label="Mobilnavigation">

    <button data-page="saved"><span>♡</span>Min lista</button>
  </nav>
  <div class="modal-backdrop hidden" id="detailBackdrop" role="presentation">
    <section class="detail-dialog" role="dialog" aria-modal="true" aria-labelledby="detailHeading" id="detailDialog">
      <button class="modal-close" id="detailClose" aria-label="Stäng">✕</button>
      <div id="detailContent"></div>
    </section>

  <div class="toast hidden" id="toast" role="status"></div>
  <script>
/* StreamHub v3 — independent TMDB-powered Swedish streaming catalogue prototype.
 * No credentials or playback are requested from streaming providers. */
(() => {
  'use strict';

  const API = 'https://api.themoviedb.org/3';
  const IMG = 'https://image.tmdb.org/t/p/';
  const SETTINGS_KEY = 'streamhub_settings_v1';
  const SAVED_KEY = 'streamhub_saved_v1';
  const PROVIDERS = {
    netflix: { label: 'Netflix', color: '#E50914', url: 'https://www.netflix.com/browse' },
    prime: { label: 'Prime Video', color: '#19A6D5', url: 'https://www.primevideo.com/' },
    tv4: { label: 'TV4 Play', color: '#F6BB3B', url: 'https://www.tv4play.se/' },
    viaplay: { label: 'Viaplay', color: '#EF4E91', url: 'https://viaplay.se/' },
    svt: { label: 'SVT Play', color: '#E9ECF0', url: 'https://www.svtplay.se/' },
    hbomax: { label: 'HBO Max', color: '#7154D4', url: 'https://www.hbomax.com/' },
    disney: { label: 'Disney+', color: '#1978D4', url: 'https://www.disneyplus.com/' }
  };
  // These URLs open a provider's own TITLE SEARCH, not a licensed playback deeplink.
  // Where a stable title-search URL has not been verified, open the service home page instead.
  // These links do not bypass sign-in or start playback.
  function serviceSearchLink(service, title) {
    const q = encodeURIComponent(nameOf(title));
    if (service === 'netflix') return `https://www.netflix.com/search?q=${q}`;
    if (service === 'prime') return `https://www.primevideo.com/search?phrase=${q}`;
    if (service === 'tv4') return `https://www.tv4play.se/sok/${q}`;
    if (service === 'svt') return `https://www.svtplay.se/sok?q=${q}`;
    return null;
  }
  const GENRES = {
    all: { label: 'Alla genrer' },
    action: { label: 'Action', movie: 28, tv: 10759 },
    comedy: { label: 'Komedi', movie: 35, tv: 35 },
    drama: { label: 'Drama', movie: 18, tv: 18 },
    documentary: { label: 'Dokumentär', movie: 99, tv: 99 },
    scifi: { label: 'Sci-fi', movie: 878, tv: 10765 },
    crime: { label: 'Kriminal', movie: 80, tv: 80 }
  };
  // Deliberately no availability claims in the demo. These are example titles, not a catalogue snapshot.
  const DEMO = [
    ['dune','movie','Dune: Part Two',2024,'action','#996D3E','En storslagen science fiction-berättelse på ökenplaneten Arrakis.'],
    ['opp','movie','Oppenheimer',2023,'drama','#795748','Ett historiskt drama om fysikern bakom Manhattanprojektet.'],
    ['batman','movie','The Batman',2022,'action','#9B2E31','En mörk kriminalhistoria i Gotham City.'],
    ['interstellar','movie','Interstellar',2014,'scifi','#355B77','En expedition genom rymden i sökandet efter en ny framtid.'],
    ['barbie','movie','Barbie',2023,'comedy','#DA5998','En lekfull berättelse om identitet och omvärlden.'],
    ['parasite','movie','Parasite',2019,'drama','#55735D','En prisbelönt thriller med klasskillnader i centrum.'],
    ['topgun','movie','Top Gun: Maverick',2022,'action','#53718F','En pilot återvänder för att utbilda en ny generation.'],
    ['grand','movie','The Grand Budapest Hotel',2014,'comedy','#9B597B','En säregen berättelse från ett europeiskt hotell.'],
    ['breaking','tv','Breaking Bad',2008,'crime','#46693D','En kemilärares liv tar en oväntad och farlig vändning.'],
    ['stranger','tv','Stranger Things',2016,'scifi','#6D3146','Mystiska händelser drabbar en amerikansk småstad.'],
    ['bear','tv','The Bear',2022,'drama','#71603B','Intensiv vardag i ett restaurangkök.'],
    ['severance','tv','Severance',2022,'scifi','#4F7F81','En arbetsplats där privatliv och yrkesliv skiljs åt.'],
    ['lastofus','tv','The Last of Us',2023,'drama','#5A6550','Två människor försöker överleva i en förändrad värld.'],
    ['succession','tv','Succession',2018,'drama','#666C79','Maktkamp inom en familjs medieimperium.'],
    ['white','tv','The White Lotus',2021,'drama','#4E8290','Satir och mysterier på exklusiva semesterhotell.'],
    ['shogun','tv','Shōgun',2024,'drama','#8B442D','Ett historiskt drama om makt och lojalitet i Japan.'],
    ['dark','tv','Dark',2017,'scifi','#384756','Ett tidsresedrama som börjar med ett försvinnande.'],
    ['chernobyl','tv','Chernobyl',2019,'drama','#738077','Dramatisering av kärnkraftskatastrofen 1986.']
  ].map(([id,type,title,year,genre,palette,overview]) => ({
    id: `demo-${id}`, media_type: type, title, year, genre, palette, overview,
    poster_path: null, backdrop_path: null, vote_average: 0, demo: true
  }));

  const $ = (sel, root = document) => root.querySelector(sel);
  const $$ = (sel, root = document) => [...root.querySelectorAll(sel)];
  function loadJSON(key, fallback) {
    try { const v = JSON.parse(localStorage.getItem(key)); return v === null ? fallback : v; }
    catch { return fallback; }
  }
  const loaded = loadJSON(SETTINGS_KEY, {});
  // Keep existing services and add the three new ones on the first v3 visit.
  // After this one-time migration, manual service choices are respected.
  const EXTRA_PROVIDERS = ['svt','hbomax','disney'];
  const storedEnabled = Array.isArray(loaded.enabled) ? loaded.enabled.filter(k => PROVIDERS[k]) : null;
  const shouldMigrate = Boolean(storedEnabled && (Number(loaded.providersVersion) || 1) < 3);
  const enabledAtStart = storedEnabled ? [...storedEnabled] : Object.keys(PROVIDERS);
  if (shouldMigrate) for (const key of EXTRA_PROVIDERS) { if (!enabledAtStart.includes(key)) enabledAtStart.push(key); }
  const state = {
    page: 'home', service: 'all', genre: 'all', sort: 'popular', search: '',
    token: typeof loaded.token === 'string' ? loaded.token : '',
    enabled: enabledAtStart,
    saved: loadJSON(SAVED_KEY, []).filter?.(x => x && typeof x.id !== 'undefined') || [],
    providerIds: null, providerLogos: null, catalogue: [], homeShelves: null,
    nextPage: 1, totalPages: 1, busy: false, seq: 0, detailSeq: 0,
    lastFocus: null
  };
  let toastTimeout;
  let searchTimer;
  const escapeHTML = value => String(value ?? '').replace(/[&<>"']/g, ch => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
  const safePoster = (path, size = 'w342') => /^\/[\w./-]+$/.test(path || '') ? `${IMG}${size}${path}` : '';
  const yearOf = obj => obj.year || Number(String(obj.release_date || obj.first_air_date || '').slice(0,4)) || null;
  const nameOf = obj => obj.title || obj.name || obj.original_title || obj.original_name || 'Utan titel';
  const idOf = obj => `${obj.media_type}:${obj.id}`;
  const isSaved = obj => state.saved.some(x => idOf(x) === idOf(obj));
  const pageKey = () => `${state.page}/${state.service}/${state.genre}/${state.sort}/${state.search}`;
  const apiMode = () => !!state.token;
  const today = () => new Date().toISOString().slice(0,10);
  const providersSelected = () => state.service === 'all' ? state.enabled : [state.service].filter(k => state.enabled.includes(k));
  const persistSettings = () => localStorage.setItem(SETTINGS_KEY, JSON.stringify({ token: state.token, enabled: state.enabled, providersVersion: 3 }));
  const persistSaved = () => localStorage.setItem(SAVED_KEY, JSON.stringify(state.saved));
  const isMovie = x => x.media_type === 'movie';
  const apiTitle = (x) => ({ ...x, media_type: x.media_type });

  function flash(msg) {
    const el = $('#toast'); if (!el) return;
    el.textContent = msg; el.classList.remove('hidden');
    clearTimeout(toastTimeout); toastTimeout = setTimeout(() => el.classList.add('hidden'), 3200);
  }
  function apiAuth(token) {
    const bearer = token.startsWith('eyJ');
    return bearer ? { headers: { Authorization: `Bearer ${token}` } } : {};
  }
  async function tmdb(endpoint, params = {}, tokenOverride = state.token) {
    const url = new URL(`${API}${endpoint}`);
    url.searchParams.set('language','sv-SE');
    for (const [key, val] of Object.entries(params)) if (val !== null && val !== undefined && val !== '') url.searchParams.set(key, String(val));
    if (!tokenOverride.startsWith('eyJ')) url.searchParams.set('api_key', tokenOverride);
    const resp = await fetch(url.href, { ...apiAuth(tokenOverride), headers: { ...apiAuth(tokenOverride).headers, Accept: 'application/json' } });
    if (!resp.ok) {
      if (resp.status === 401) throw new Error('Nyckeln eller token är ogiltig. Kontrollera den i Inställningar.');
      if (resp.status === 429) throw new Error('TMDB har tillfälligt begränsat antalet anrop. Prova igen om en stund.');
      throw new Error(`TMDB svarade med fel ${resp.status}.`);
    }
    return resp.json();
  }
  function matchProvider(name, service) {
    const n = String(name || '').toLowerCase().trim();
    if (service === 'netflix') return n === 'netflix' || /^netflix (standard|basic|premium|with ads)\b/.test(n);
    if (service === 'prime') return /^(amazon prime video|prime video)(\b|$)/.test(n) && !n.includes('channel');
    if (service === 'tv4') return /^tv4 play\b/.test(n) && !n.includes('channel');
    if (service === 'viaplay') return /^viaplay\b/.test(n) && !n.includes('channel');
    if (service === 'svt') return /^(svt|svt play)(\b|$)/.test(n) && !n.includes('channel');
    if (service === 'hbomax') return /^(hbo max|max)(\b|$)/.test(n) && !n.includes('channel');
    if (service === 'disney') return /^(disney\+|disney plus)(\b|$)/.test(n) && !n.includes('channel');
    return false;
  }
  async function discoverProviderIds() {
    const [movie, tv] = await Promise.all([
      tmdb('/watch/providers/movie', { watch_region:'SE' }),
      tmdb('/watch/providers/tv', { watch_region:'SE' })
    ]);
    const idMap = {}; const logos = {};
    for (const [type, list] of [['movie', movie.results], ['tv', tv.results]]) {
      idMap[type] = {};
      for (const service of Object.keys(PROVIDERS)) {
        const matching = (list || []).filter(entry => matchProvider(entry.provider_name, service));
        idMap[type][service] = matching.map(entry => entry.provider_id);
        if (matching[0]?.logo_path) logos[service] = safePoster(matching[0].logo_path, 'w92');
      }
    }
    state.providerIds = idMap; state.providerLogos = logos;
  }
  function idsFor(type) {
    return [...new Set(providersSelected().flatMap(k => state.providerIds?.[type]?.[k] || []))];
  }
  function providerFilter(type) {
    const ids = idsFor(type);
    if (!ids.length) return null;
    return {
      watch_region: 'SE',
      with_watch_providers: ids.join('|'),
      // SVT Play often appears as 'free' or 'ads' instead of 'flatrate'.
      with_watch_monetization_types: providersSelected().includes('svt') ? 'flatrate|free|ads' : 'flatrate'
    };
  }
  function queryOptions(type, page = 1) {
    const args = { page, include_adult: false, sort_by: 'popularity.desc', ...providerFilter(type) };
    if (state.genre !== 'all' && GENRES[state.genre]?.[type]) args.with_genres = GENRES[state.genre][type];
    if (state.sort === 'rating') { args.sort_by = 'vote_average.desc'; args['vote_count.gte'] = 100; }
    if (state.sort === 'recent') {
      args.sort_by = type === 'movie' ? 'primary_release_date.desc' : 'first_air_date.desc';
      args[type === 'movie' ? 'primary_release_date.lte' : 'first_air_date.lte'] = today();
      args[type === 'movie' ? 'primary_release_date.gte' : 'first_air_date.gte'] = '2000-01-01';
    }
    return args;
  }
  async function discover(type, page = 1, override = null) {
    if (!providerFilter(type)) return { results: [], total_pages: 0 };
    const data = await tmdb(`/discover/${type}`, override ? {...queryOptions(type,page),...override} : queryOptions(type,page));
    return { ...data, results: (data.results || []).map(r => ({ ...r, media_type: type })) };
  }
  function actualServicesFor(regionData) {
    const subscriptionOffers = regionData?.flatrate || [];
    const freeOffers = [...(regionData?.free || []), ...(regionData?.ads || [])];
    return Object.keys(PROVIDERS).filter(k =>
      subscriptionOffers.some(p => matchProvider(p.provider_name, k))
      || (k === 'svt' && freeOffers.some(p => matchProvider(p.provider_name, k)))
    );
  }
  async function providerInfo(title) {
    if (title.demo) return { services: [], link: '', demo:true };
    const data = await tmdb(`/${title.media_type}/${title.id}/watch/providers`);
    const se = data.results?.SE;
    return { services: actualServicesFor(se), link: se?.link || '', flatrate: se?.flatrate || [], free: se?.free || [], ads: se?.ads || [], rent: se?.rent || [], buy: se?.buy || [] };
  }
  function demoResults(type, page = 1) {
    const q = state.search.trim().toLocaleLowerCase('sv-SE');
    const matches = DEMO.filter(item => (type === 'all' || item.media_type === type)
      && (state.genre === 'all' || item.genre === state.genre)
      && (!q || `${item.title} ${item.overview}`.toLocaleLowerCase('sv-SE').includes(q)));
    if (state.sort === 'recent') matches.sort((a,b) => b.year - a.year);
    if (state.sort === 'rating') matches.sort((a,b) => a.title.localeCompare(b.title,'sv'));
    return { results: matches.slice((page-1)*18,page*18), total_pages: Math.ceil(matches.length/18) };
  }
  function normalizeSaved(o) {
    return { id:o.id, media_type:o.media_type, title:nameOf(o), poster_path:o.poster_path || null, backdrop_path:o.backdrop_path || null,
      year:yearOf(o), overview:o.overview || '', vote_average:o.vote_average || 0, genre:o.genre || '', palette:o.palette || null, demo:!!o.demo };
  }
  function toggleSaved(title) {
    const key = idOf(title), idx = state.saved.findIndex(x=>idOf(x)===key);
    if (idx > -1) { state.saved.splice(idx,1); flash('Borttagen från Min lista'); }
    else { state.saved.unshift(normalizeSaved(title)); flash('Tillagd i Min lista'); }
    persistSaved();
    if (state.page === 'saved') render();
    else {
      $$(`[data-save-id="${CSS.escape(key)}"]`).forEach(el => {
        const saved = idx === -1; el.textContent = saved ? '♥' : '♡'; el.setAttribute('aria-label',saved?'Ta bort från Min lista':'Lägg till i Min lista');
      });
    }
  }
  function displayYear(title) { return yearOf(title) || '—'; }
  function poster(title, idx = 0) {
    const path = safePoster(title.poster_path);
    const fallback = title.palette || ['#674A71','#4E7187','#856A45','#606C64','#83544A','#644F82'][idx % 6];
    if (path) return `<img src="${path}" alt="Affisch: ${escapeHTML(nameOf(title))}" loading="lazy" decoding="async" />`;
    return `<span class="poster-art" style="--art:${escapeHTML(fallback)}"><span class="poster-art-tint">STREAMHUB • ${title.demo?'DEMO':'FILM & SERIER'}</span><span class="poster-art-symbol">✧</span><span class="poster-art-title">${escapeHTML(nameOf(title))}</span></span>`;
  }
  function card(title, idx = 0) {
    const rating = !title.demo && Number(title.vote_average) > 0 ? `<span class="rating"><strong>★</strong> ${Number(title.vote_average).toFixed(1)}</span>` : '';
    return `<article class="catalog-item"><button type="button" class="title-card" data-open="${escapeHTML(idOf(title))}" aria-label="Detaljer för ${escapeHTML(nameOf(title))}">
        <div class="poster-frame">${poster(title,idx)}${rating}</div>
        <div class="poster-title" title="${escapeHTML(nameOf(title))}">${escapeHTML(nameOf(title))}</div>
        <div class="poster-subtitle">${displayYear(title)} <span class="sub-dot">·</span> ${isMovie(title) ? 'Film':'Serie'}${title.demo?' · Exempel':''}</div>
      </button><button type="button" class="save-card" data-save-id="${escapeHTML(idOf(title))}" aria-label="${isSaved(title)?'Ta bort från Min lista':'Lägg till i Min lista'}" title="Min lista">${isSaved(title)?'♥':'♡'}</button></article>`;
  }
  function cards(items) { return `<div class="poster-grid">${items.map(card).join('')}</div>`; }
  function skeleton() { return `<div class="loading-grid">${Array.from({length:12},()=>'<div class="skeleton"></div>').join('')}</div>`; }
  function noResults(msg = 'Inga titlar hittades för det här urvalet.') {
    return `<div class="status-box"><h2>Inga träffar</h2><p>${escapeHTML(msg)}</p><button class="action-secondary" data-reset-filters>Rensa filtren</button></div>`;
  }
  function demoBanner() {
    return `<div class="notice demo-notice"><strong>Förhandsvisning:</strong> Titlarna är exempel och ingen tillgänglighet hos streamingtjänsterna är kontrollerad. För aktuell svensk katalog, lägg in en egen TMDB-nyckel under <button class="text-link" data-page="settings">Inställningar</button>.</div>`;
  }
  function pills() {
    return `<div class="filter-row" role="group" aria-label="Välj streamingtjänst">
    <button class="filter-pill ${state.service === 'all'?'active':''}" data-service="all">Alla mina tjänster</button>
    ${Object.entries(PROVIDERS).filter(([id]) => state.enabled.includes(id)).map(([id,s]) => `<button class="filter-pill ${state.service === id?'active':''}" data-service="${id}"><span class="filter-dot" style="--dot:${s.color}"></span>${s.label}</button>`).join('')}
    </div>`;
  }
  function toolbar() {
    return `<div class="toolbar"><label class="toolbar-label" for="genreSelect">Genre</label>
      <select id="genreSelect" aria-label="Filtrera på genre">${Object.entries(GENRES).map(([k,g])=>`<option value="${k}" ${state.genre===k?'selected':''}>${g.label}</option>`).join('')}</select>
      <label class="toolbar-label" for="sortSelect">Sortera</label>
      <select id="sortSelect" aria-label="Sortera titlar"><option value="popular" ${state.sort==='popular'?'selected':''}>Mest populära</option><option value="recent" ${state.sort==='recent'?'selected':''}>Senaste premiär</option><option value="rating" ${state.sort==='rating'?'selected':''}>Högst betyg</option></select>
      <span class="toolbar-spacer"></span><span class="section-hint">🇸🇪 Tillgänglighet i Sverige · Abonnemang &amp; gratis</span></div>`;
  }
  function hero() {
    return `<section class="hero"><span class="hero-spark" aria-hidden="true">▶</span><div class="hero-copy">
      <span class="welcome-kicker">EN SÖKNING · SJU STREAMINGTJÄNSTER</span>
      <h1>Allt du vill se.<br /><em>På ett ställe.</em></h1>
      <p>Upptäck filmer och serier utan att bläddra mellan appar. Filtrera på dina tjänster, spara favoriter och hitta var titlarna går att se.</p>
      <div class="hero-buttons"><button class="action-primary" data-page="movie">Utforska filmer <span aria-hidden="true">→</span></button>
      ${!apiMode()?'<button class="action-secondary" data-page="settings">Anslut katalogen</button>':'<button class="action-secondary" data-page="saved">Visa Min lista</button>'}</div>
      </div></section>`;
  }
  function frame(body) { return `<div class="page-container">${body}</div>`; }
  function heading(title, hint, type = '') { return `<div class="section-heading"><h2>${title}</h2>${type ? `<button class="see-all" data-page="${type}">Visa alla →</button>` : `<span class="section-hint">${hint||''}</span>`}</div>`; }
  function renderHome() {
    const block = [hero(), `<div class="filter-block">${pills()}<span class="section-hint">Välj tjänst för att filtrera</span></div>`];
    if (!apiMode()) {
      block.push(demoBanner(), `<section class="section">${heading('Filmer att upptäcka','','movie')}${cards(demoResults('movie').results.slice(0,12))}</section>`,
        `<section class="section">${heading('Serier att upptäcka','','tv')}${cards(demoResults('tv').results.slice(0,12))}</section>`);
    } else if (state.homeShelves) {
      const {movies,series,recent} = state.homeShelves;
      block.push(`<section class="section">${heading('Populära filmer','','movie')}${movies.length?cards(movies):noResults()}</section>`,
        `<section class="section">${heading('Populära serier','','tv')}${series.length?cards(series):noResults()}</section>`,
        `<section class="section">${heading('Senaste premiärer','Utgivningsdatum, inte datum för streamingpremiär')}${recent.length?cards(recent):noResults()}</section>`);
    } else block.push(`<section class="section">${heading('Hämtar den svenska katalogen','')}${skeleton()}</section>`);
    block.push(`<div class="notice"><strong>Så fungerar det:</strong> StreamHub visar abonnemangs- och gratistillgänglighet enligt katalogdata. Själva videon öppnas inte här. För uppspelning använder du den tjänst där titeln finns. Utbud och visningsrättigheter kan ändras.</div>`);
    $('#main').innerHTML = frame(block.join(''));
  }
  function renderBrowse() {
    const kind = state.page === 'movie' ? 'Filmer' : 'Serier';
    const caption = apiMode() ? 'Katalog från valda streamingtjänster (Sverige)' : 'Exempeltitlar – anslut TMDB för aktuellt utbud';
    let content = `<h1 class="page-title">${kind}</h1><p class="page-summary">${caption}</p>
      <div class="filter-block">${pills()}</div>${toolbar()}`;
    if (!apiMode()) content += demoBanner();
    const visible = apiMode() ? state.catalogue : demoResults(state.page).results;
    content += state.busy && !visible.length ? skeleton() : visible.length ? cards(visible) : noResults(
      apiMode() ? 'Inga titlar hittades. Kontrollera att minst en tjänst är vald i Inställningar.' : 'Det finns inga exempeltitlar i den här kategorin.');
    if (state.nextPage <= state.totalPages && state.catalogue.length && apiMode()) content += `<div class="load-more"><button class="load-button" data-load-more ${state.busy?'disabled':''}>${state.busy?'Laddar ...':'Visa fler titlar ↓'}</button></div>`;
    $('#main').innerHTML = frame(content);
  }
  function renderSaved() {
    $('#main').innerHTML = frame(`<h1 class="page-title">Min lista</h1><p class="page-summary">Dina sparade filmer och serier lagras i den här webbläsaren. De synkas inte mellan enheter.</p>
      ${state.saved.length?`${cards(state.saved)}<div class="list-actions"><button class="action-secondary" id="clearSaved">Töm listan</button></div>`:
      `<div class="status-box empty-state"><h2>Din lista är tom</h2><p>Tryck på hjärtat vid en film eller serie för att spara den här.</p><button class="action-primary" data-page="home">Upptäck titlar →</button></div>`}`);
  }
  function renderSettings() {
    const rows = Object.entries(PROVIDERS).map(([id,s])=>`<label class="provider-check"><input type="checkbox" name="enabledProvider" value="${id}" ${state.enabled.includes(id)?'checked':''}><span class="service-mark" style="--provider-color:${s.color}"></span><span>${s.label}</span></label>`).join('');
    const detected = state.providerIds ? `<div class="provider-diagnostics">${Object.entries(PROVIDERS).map(([id,s])=> {
      const nMovie = state.providerIds.movie[id]?.length || 0, nTv = state.providerIds.tv[id]?.length || 0;
      return `<div>${s.label}: ${nMovie||nTv?`<span class="verified">✓ Identifierad</span>`:`<span class="unverified">Inte hittad i TMDB:s svenska leverantörslista</span>`}</div>`;
    }).join('')}</div>` : '';
    $('#main').innerHTML = frame(`<h1 class="page-title">Inställningar</h1><p class="page-summary">Anslut aktuell svensk filminformation och välj tjänster du använder.</p>
      <div class="settings-layout"><section class="status-box"><h2>1. Anslut TMDB</h2><p>För livekatalogen behövs en personlig API-nyckel (v3) eller en API Read Access Token (v4) från The Movie Database.</p>
        <form id="tokenForm"><label class="field-label" for="tmdbToken">TMDB API-nyckel / Read Access Token</label>
        <input class="field-input" id="tmdbToken" name="token" type="password" spellcheck="false" autocomplete="off" value="${escapeHTML(state.token)}" placeholder="Klistra in API-nyckeln här" />
        <div class="setup-actions"><button type="submit" class="action-primary">Anslut och verifiera</button>${apiMode()?'<button type="button" class="action-secondary" id="forgetToken">Koppla från</button>':''}</div>
        <p class="setting-note" id="tokenStatus">${apiMode()?'Ansluten. Nyckeln lagras lokalt i din webbläsare.':'Inte ansluten – du ser ett demoutbud.'}</p></form>
        <p class="fineprint">Skapa en kostnadsfri nyckel för icke-kommersiellt bruk via <a target="_blank" rel="noopener noreferrer" href="https://www.themoviedb.org/settings/api">themoviedb.org/settings/api ↗</a>. Lägg inte in en hemlig servernyckel i en offentlig webbapp. Den här prototypen lagrar token lokalt i webbläsaren, och den är åtkomlig för skript på sidan.</p></section>
        <section class="status-box"><h2>2. Mina streamingtjänster</h2><p>Välj vilka streamingtjänster som ska ingå i sökningen, inklusive gratis SVT Play. StreamHub loggar aldrig in på tjänsterna.</p>
        <div class="provider-check-list">${rows}</div><p class="setting-note">Endast titlar som enligt TMDB ingår i abonnemang eller kan ses gratis tas med (inte enbart hyr/köp). SVT Play omfattar även gratis och reklamfinansierade titlar när uppgifterna finns i TMDB.</p>
        ${detected}<div class="setup-actions"><button class="action-primary" id="saveProviders">Spara tjänster</button></div></section></div>
        <section class="status-box"><h2>Viktigt om uppspelning</h2><p>De andra streamingtjänsternas uppspelning, kontoinloggning och fortsätt-titta fungerar inte inuti StreamHub. Filmdetaljer länkar till en tillgänglighetssida på TMDB, där länkar vidare till tjänster kan finnas. Det är ingen garanti för direktuppspelning.</p>
        <p class="setting-note">Den här versionen kräver inget eget användarkonto och skickar inga inloggningsuppgifter till streamingtjänsterna.</p></section>`);
  }
  function renderSearch() {
    const q = state.search.trim();
    let content = `<h1 class="page-title">Sökresultat</h1><p class="page-summary">Sökning efter ”${escapeHTML(q)}” i ${apiMode()?'det svenska streamingutbudet':'exempelkatalogen'}.</p>`;
    if (!apiMode()) content += demoBanner();
    const visible = apiMode() ? state.catalogue : demoResults('all').results;
    content += state.busy && !visible.length ? skeleton() : visible.length ? cards(visible) : noResults(
      apiMode() ? 'Inga tillgängliga titlar hittades bland de sökträffar vi har kontrollerat.' : 'Inga exempeltitlar matchar din sökning.');
    content += `<div class="notice">Sökning i livekatalogen begränsas till de första sökträffarna och kontrollerar vilka som har abonnemangs- eller gratistillgänglighet i Sverige. Det är inte en fullständig databas för alla tjänster.</div>`;
    $('#main').innerHTML = frame(content);
  }
  function render() {
    $$('#sidebarNav [data-page], .bottom-nav [data-page]').forEach(btn=>{
      const active = state.search.trim().length >= 2 ? false : btn.dataset.page === state.page;
      btn.classList.toggle('active',active); btn.setAttribute('aria-current',active?'page':'false');
    });
    if (state.search.trim().length >= 2) renderSearch();
    else if (state.page === 'home') renderHome();
    else if (state.page === 'saved') renderSaved();
    else if (state.page === 'settings') renderSettings();
    else renderBrowse();
  }
  function renderProvidersSidebar() {
    $('#sidebarProviders').innerHTML = Object.entries(PROVIDERS).map(([id,s])=>
      `<button class="service-item" data-service="${id}" title="Filtrera på ${s.label}"><span class="service-mark" style="--provider-color:${s.color}"></span>${s.label}</button>`).join('');
  }
  function navigate(page, clearSearch = true) {
    state.page = page;
    if (clearSearch) { state.search = ''; $('#searchInput').value = ''; }
    state.genre = 'all'; state.sort='popular'; state.catalogue=[]; state.homeShelves=null;
    state.nextPage = 1; state.seq++; window.scrollTo({top:0,behavior:'instant'});
    render(); if (apiMode() && ['home','movie','tv'].includes(page)) reload();
    $('#main').focus({preventScroll:true});
  }
  function selectService(service) {
    if (!apiMode() && service !== 'all') { flash('Tjänstefilter aktiveras när du ansluter TMDB.'); return; }
    if (service !== 'all' && !state.enabled.includes(service)) { flash('Aktivera tjänsten under Inställningar'); return; }
    state.service = service; state.catalogue=[]; state.homeShelves=null; state.nextPage=1; state.seq++;
    if (state.page === 'settings' || state.page === 'saved') state.page = 'home';
    render(); if (apiMode()) reload();
  }
  async function loadHome() {
    const seq = ++state.seq;
    if (!providersSelected().length) { state.homeShelves={ movies:[],series:[],recent:[] }; render(); return; }
    state.busy=true; render();
    try {
      const [movies,series,recent] = await Promise.all([
        discover('movie'), discover('tv'), discover('movie', 1, {
          sort_by: 'primary_release_date.desc', 'primary_release_date.lte':today(),
          'primary_release_date.gte':'2022-01-01'
        })
      ]);
      if (seq !== state.seq || state.page!=='home') return;
      state.homeShelves = { movies: movies.results.slice(0,12), series: series.results.slice(0,12), recent: recent.results.slice(0,12) };
    } catch(err) { if(seq===state.seq) showError(err); }
    finally { if (seq===state.seq) {state.busy=false;render();} }
  }
  async function loadBrowse(append = false) {
    if (state.busy) return;
    const seq = ++state.seq, type = state.page, page = append ? state.nextPage : 1;
    state.busy = true; render();
    try {
      const response = await discover(type, page);
      if (seq !== state.seq || state.page !== type) return;
      const prior = append ? state.catalogue : [];
      const all = [...prior,...response.results];
      state.catalogue = all.filter((item,index)=>all.findIndex(x=>idOf(x)===idOf(item))===index);
      state.totalPages = Math.min(response.total_pages || 0, 500); state.nextPage=page+1;
    } catch(err) { if (seq===state.seq) showError(err); }
    finally { if (seq===state.seq) {state.busy=false;render();} }
  }
  async function loadSearch() {
    if (!state.search.trim()) return;
    const seq = ++state.seq, query = state.search.trim();
    state.busy=true; state.catalogue=[]; render();
    try {
      const data = await tmdb('/search/multi', { query, include_adult:false, page:1 });
      const candidates = (data.results || []).filter(item => ['movie','tv'].includes(item.media_type)).slice(0,20);
      const selected = providersSelected();
      const results = [];
      // Batch the lookups; this limits load and avoids depending on provider links being deep links.
      for (let start=0; start<candidates.length; start+=5) {
        const batch = candidates.slice(start,start+5);
        const checks = await Promise.all(batch.map(async item => {
          try { const info = await providerInfo(item); return info.services.some(service=>selected.includes(service)) ? item : null; }
          catch { return null; }
        }));
        if (seq!==state.seq) return;
        results.push(...checks.filter(Boolean));
      }
      if (seq !== state.seq) return;
      state.catalogue = results;
    } catch(err) { if(seq===state.seq) showError(err); }
    finally {if(seq===state.seq) {state.busy=false;render();}}
  }
  function showError(err) {
    const msg = err?.message || 'Ett nätverksfel inträffade.';
    flash(msg);
    if (state.page==='home') {
      state.homeShelves={movies:[],series:[],recent:[]};
    }
    const main = $('#main');
    if(main) main.insertAdjacentHTML('afterbegin', `<div class="page-container"><div class="error-strip" role="alert">${escapeHTML(msg)} <button class="text-link" data-page="settings">Inställningar</button></div></div>`);
  }
  async function reload() {
    if (!apiMode()) {render(); return;}
    if (!state.providerIds) {
      const seq = ++state.seq;
      state.busy=true; render();
      try { await discoverProviderIds(); }
      catch(err) { if(seq===state.seq) showError(err); state.busy=false; render(); return; }
      if(seq !== state.seq) return;
      state.busy=false;
    }
    if (state.search.trim().length>=2) loadSearch();
    else if (state.page==='home') loadHome();
    else if (state.page==='movie' || state.page==='tv') loadBrowse();
  }
  function lookupTitle(key) {
    return [...state.catalogue, ...(state.homeShelves ? Object.values(state.homeShelves).flat() : []),...state.saved,...DEMO].find(x=>idOf(x)===key);
  }
  async function openDetail(title) {
    if (!title) return;
    state.lastFocus=document.activeElement;
    const backdrop = $('#detailBackdrop'), body = $('#detailContent'), seq=++state.detailSeq;
    backdrop.classList.remove('hidden'); document.body.classList.add('modal-open');
    body.innerHTML = `<div class="detail-hero" style="background:linear-gradient(140deg,#48405e,#151823)"></div><div class="detail-body"><h2 id="detailHeading">${escapeHTML(nameOf(title))}</h2><p class="setting-note">Hämtar detaljer…</p></div>`;
    $('#detailClose').focus();
    let item = title, info = {services:[],link:'',demo:!!title.demo};
    if (!title.demo && apiMode()) {
      try {
        const [details,providers] = await Promise.all([tmdb(`/${title.media_type}/${title.id}`),providerInfo(title)]);
        if (seq!==state.detailSeq) return;
        item = {...title,...details,media_type:title.media_type}; info = providers;
      } catch(e) { if (seq===state.detailSeq) flash('Kunde inte hämta fullständig information.'); }
    }
    if(seq!==state.detailSeq) return;
    const backdropUrl=safePoster(item.backdrop_path,'w1280');
    const year=displayYear(item);
    const duration = item.runtime ? `${item.runtime} min` : item.episode_run_time?.[0] ? `${item.episode_run_time[0]} min/avsnitt`:'';
    const genres = (item.genres || []).map(g=>g.name).join(', ');
    const services = info.services.filter(s=>state.enabled.includes(s));
    const offers = services.map(s=>`<span class="offer-badge"><span class="service-mark" style="--provider-color:${PROVIDERS[s].color}"></span>${PROVIDERS[s].label}<small>${s === 'svt' ? 'Gratis enligt katalogdata' : 'Ingår enligt katalogdata'}</small></span>`).join('');
    const bodyHTML = `<div class="detail-hero" ${backdropUrl ? `style="background-image:linear-gradient(0deg,#161a25 0%,transparent 85%),url('${backdropUrl}')"`:''}></div>
      <div class="detail-body"><h2 id="detailHeading">${escapeHTML(nameOf(item))}</h2>
      <div class="detail-meta"><span>${escapeHTML(String(year))}</span><span>${isMovie(item)?'Film':'Serie'}</span>${duration?`<span>${escapeHTML(duration)}</span>`:''}
       ${Number(item.vote_average)>0?`<span>★ ${Number(item.vote_average).toFixed(1)} / 10</span>`:''}${genres?`<span>${escapeHTML(genres)}</span>`:''}</div>
      <p class="detail-desc">${escapeHTML(item.overview || 'Beskrivning saknas.')}</p>
      <h3 class="detail-subheading">Var kan jag titta?</h3>
      ${title.demo?`<div class="disclosure">Demotitlarna visar ingen verifierad streamingtillgänglighet. Anslut en TMDB-nyckel för att kontrollera det aktuella utbudet.</div>`:
        offers?`<div class="offer-list">${offers}</div>`:
        `<div class="disclosure">Ingen abonnemangs- eller gratistillgänglighet har kunnat verifieras hos de valda tjänsterna.</div>`}
      <div class="detail-actions">
        ${info.link ? `<a class="action-primary" href="${escapeHTML(info.link)}" target="_blank" rel="noopener noreferrer">Visa var den finns ↗</a>`:
          (!title.demo?`<a class="action-primary" href="https://www.themoviedb.org/${item.media_type}/${encodeURIComponent(item.id)}/watch?locale=SE" target="_blank" rel="noopener noreferrer">Se visningsalternativ ↗</a>`:'')}
        <button type="button" class="action-secondary" data-modal-save="${escapeHTML(idOf(title))}">${isSaved(title)?'♥ Ta bort från Min lista':'♡ Spara i Min lista'}</button>
      </div>
      ${!title.demo && services.length ? `<div class="service-open-block"><h3 class="detail-subheading">Öppna hos din streamingtjänst</h3><p class="service-help">Välj tjänst för att söka efter just den här titeln. Det öppnar inte filmen direkt.</p><div class="service-open-actions">${services.map(s=> {
          const searchLink = serviceSearchLink(s, item);
          return `<a class="service-open-link" href="${escapeHTML(searchLink || PROVIDERS[s].url)}" target="_blank" rel="noopener noreferrer"><span class="service-mark" style="--provider-color:${PROVIDERS[s].color}"></span>${searchLink ? `Sök hos ${PROVIDERS[s].label} ↗` : `Öppna ${PROVIDERS[s].label} ↗`}</a>`;
        }).join('')}<button type="button" class="action-secondary" data-copy-title="${escapeHTML(nameOf(item))}">Kopiera titel</button></div></div>`:''}
      <div class="disclosure"><strong>Observera:</strong> ”Visa var den finns” leder till en översikt med visningsalternativ, inte direkt till videon. Sökknapparna öppnar streamingtjänstens sökning där den finns tillgänglig. För Viaplay, HBO Max och Disney+ öppnas respektive tjänsts startsida när ingen stabil söklänk är verifierad. SVT Play öppnar en titelsökning. Sökresultatet kan skilja sig från TMDB:s katalogdata. Streamingrättigheter, abonnemangsnivåer och uppspelning kontrolleras av respektive tjänst. ${info.link?'Tillgänglighetsinformation: JustWatch via TMDB.':''}</div>
      </div>`;
    body.innerHTML = bodyHTML;
  }
  function closeDetail() {
    $('#detailBackdrop').classList.add('hidden'); document.body.classList.remove('modal-open');
    state.detailSeq++;
    if (state.lastFocus?.isConnected) state.lastFocus.focus();
  }
  async function saveToken(event) {
    event.preventDefault();
    const value = $('#tmdbToken').value.trim();
    if (!value) {flash('Ange först en TMDB-nyckel eller Read Access Token.');return;}
    const status = $('#tokenStatus'); status.textContent='Verifierar mot TMDB…';
    try {
      await tmdb('/configuration', {}, value);
      state.token=value; state.providerIds=null; state.homeShelves=null; state.catalogue=[];
      persistSettings(); status.textContent='Anslutningen fungerar.';
      flash('TMDB ansluten – svensk katalog laddas'); navigate('home');
    } catch(err) {status.textContent=err?.message || 'Kunde inte verifiera nyckeln.';flash('Anslutningen misslyckades');}
  }
  function setupHandlers() {
    document.addEventListener('click', event => {
      if (event.target.closest('#detailClose')) {closeDetail();return;}
      if (event.target.id === 'detailBackdrop') {closeDetail();return;}
      const target=event.target.closest('[data-copy-title],[data-modal-save],[data-save-id],[data-open],[data-page],[data-service],[data-load-more],[data-reset-filters],#clearSaved,#forgetToken,#saveProviders,#settingsTop,#brandHome');
      if (!target) return;
      if (target.matches('a')) event.preventDefault();
      if (target.hasAttribute('data-copy-title')) {
        const title=target.dataset.copyTitle;
        if (navigator.clipboard?.writeText && window.isSecureContext) {
          navigator.clipboard.writeText(title).then(()=>flash('Titeln kopierad – klistra in hos tjänsten')).catch(()=>window.prompt('Kopiera titeln:',title));
        } else window.prompt('Kopiera titeln:',title);
        return;
      }
      if (target.hasAttribute('data-modal-save')) {
        const title=lookupTitle(target.dataset.modalSave);if(title) {toggleSaved(title);target.textContent=isSaved(title)?'♥ Ta bort från Min lista':'♡ Spara i Min lista';}return;
      }
      if (target.hasAttribute('data-save-id')) {
        const title=lookupTitle(target.dataset.saveId);if(title)toggleSaved(title);return;
      }
      if (target.hasAttribute('data-open')) {openDetail(lookupTitle(target.dataset.open));return;}
      if (target.hasAttribute('data-page')) {navigate(target.dataset.page);return;}
      if (target.hasAttribute('data-service')) {selectService(target.dataset.service);return;}
      if (target.hasAttribute('data-load-more')) {if(!state.busy)loadBrowse(true);return;}
      if (target.hasAttribute('data-reset-filters')) {
        state.genre='all';state.sort='popular';state.service='all';state.catalogue=[];
        render();if(apiMode())reload();return;
      }
      if (target.id==='settingsTop') {navigate('settings');return;}
      if (target.id==='brandHome') {navigate('home');return;}
      if (target.id==='clearSaved') {
        if (confirm('Vill du ta bort alla titlar från Min lista?')) {state.saved=[];persistSaved();render();}return;
      }
      if (target.id==='forgetToken') {state.token='';state.providerIds=null;state.homeShelves=null;state.catalogue=[];persistSettings();flash('TMDB frånkopplad');render();return;}
      if (target.id==='saveProviders') {
        const enabled=$$('input[name="enabledProvider"]:checked').map(el=>el.value);
        if (!enabled.length) {flash('Välj minst en streamingtjänst.');return;}
        state.enabled=enabled; if(!enabled.includes(state.service))state.service='all';persistSettings();flash('Streaming­tjänster sparade');navigate('home');return;
      }
    });
    $('#searchInput').addEventListener('input', e => {
      clearTimeout(searchTimer);
      const value=e.target.value;
      searchTimer=setTimeout(()=>{
        state.search=value.trim();state.catalogue=[];state.seq++;
        if(state.search.length>1) {render();if(apiMode())loadSearch();}
        else {state.search='';render();if(apiMode() && ['home','movie','tv'].includes(state.page))reload();}
      },320);
    });
    document.addEventListener('change',e=>{
      if(e.target.id==='genreSelect'||e.target.id==='sortSelect') {
        state[e.target.id==='genreSelect'?'genre':'sort']=e.target.value;
        state.catalogue=[];state.nextPage=1;state.seq++;
        if(apiMode())reload();else {state.catalogue=demoResults(state.page).results;state.totalPages=1;render();}
      }
    });
    document.addEventListener('submit',e=>{if(e.target.id==='tokenForm')saveToken(e);});
    document.addEventListener('keydown',e=>{
      if ((e.key==='/' && !['INPUT','TEXTAREA'].includes(document.activeElement.tagName)) || ((e.metaKey||e.ctrlKey)&&e.key==='k')) {
        e.preventDefault(); $('#searchInput').focus();return;
      }
      if(e.key==='Escape') {if(!$('#detailBackdrop').classList.contains('hidden'))closeDetail();else if($('#searchInput')===document.activeElement){$('#searchInput').value='';state.search='';render();if(apiMode())reload();}}
      if(e.key==='Tab' && !$('#detailBackdrop').classList.contains('hidden')) {
        const focusable=$$('#detailDialog a[href],#detailDialog button:not([disabled])');
        if(!focusable.length)return;
        if(e.shiftKey && document.activeElement===focusable[0]) {e.preventDefault();focusable[focusable.length-1].focus();}
        else if(!e.shiftKey && document.activeElement===focusable[focusable.length-1]){e.preventDefault();focusable[0].focus();}
      }
    });
  }
  function boot() {
    if (shouldMigrate) persistSettings();
    renderProvidersSidebar();setupHandlers();
    if(state.enabled.length===0)state.enabled=Object.keys(PROVIDERS);
    if (!apiMode()) {
      render();
    } else {render();reload();}
    if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
      window.addEventListener('load',()=>navigator.serviceWorker.register('./sw.js').catch(()=>{}));
    }
  }
  boot();
})();

</script>
</body>
